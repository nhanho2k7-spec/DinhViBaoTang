<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quét Mã QR Định Vị - Indoor Wayfinding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #090d16; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .click-btn {
            width: 100%; text-align: left; background-color: rgba(30, 41, 59, 0.95);
            border: 1px solid #334155; padding: 12px; border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer !important; position: relative; z-index: 999;
            transition: all 0.2s ease;
        }
        .click-btn:active { background-color: #1e293b; transform: scale(0.98); }
        
        /* Đảm bảo khung reader không chặn thao tác click */
        #reader { pointer-events: none; }
    </style>
</head>
<body>

    <div class="max-w-md w-full mx-auto flex flex-col justify-between p-4 my-auto" style="min-height: 90vh;">
        <!-- Header -->
        <header class="flex items-center justify-between pt-1 pb-3 w-full shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-base text-white leading-tight">Dẫn Đường Bảo Tàng</h1>
                    <p class="text-[11px] text-slate-400">Định vị qua Camera</p>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="my-auto space-y-4 w-full py-2">
            <div class="text-center space-y-1">
                <h2 class="text-base font-bold text-white">Quét mã QR tại cửa phòng</h2>
                <p id="cam-status" class="text-xs text-slate-400">Đưa camera vào mã QR</p>
            </div>

            <!-- Khung chứa camera -->
            <div class="relative w-full aspect-square max-w-[240px] mx-auto bg-slate-900 rounded-3xl border-2 border-slate-800 overflow-hidden shadow-2xl flex items-center justify-center">
                <div id="reader" class="w-full h-full"></div>

                <div id="camera-placeholder" class="absolute inset-0 p-4 text-center flex flex-col items-center justify-center space-y-3 bg-slate-900 z-50">
                    <div class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </div>
                    <div class="flex flex-col gap-2 w-full px-4">
                        <button type="button" onclick="startScanner()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2.5 rounded-xl shadow-lg transition-all cursor-pointer">
                            📷 Bật Camera Quét
                        </button>
                    </div>
                </div>
            </div>

            <!-- Các nút chọn nhanh điểm xuất phát -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5 relative z-50">
                <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    Hoặc chọn nhanh điểm xuất phát
                </span>
                <div class="grid grid-cols-1 gap-2">
                    <button type="button" onclick="goToMap('b104')" class="click-btn">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div style="width: 32px; height: 32px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">B104</div>
                            <div>
                                <p style="font-size: 13px; font-weight: 600; color: #fff;">Phòng B104</p>
                                
                            </div>
                        </div>
                        <span style="font-size: 12px; color: #34d399; font-weight: 500;">Vào bản đồ ➔</span>
                    </button>
                    <button type="button" onclick="goToMap('b109')" class="click-btn">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div style="width: 32px; height: 32px; background: rgba(168, 85, 247, 0.2); color: #c084fc; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">B109</div>
                            <div>
                                <p style="font-size: 13px; font-weight: 600; color: #fff;">Phòng B109</p>
                              
                            </div>
                        </div>
                        <span style="font-size: 12px; color: #34d399; font-weight: 500;">Vào bản đồ ➔</span>
                    </button>
                    <button type="button" onclick="goToMap('yte')" class="click-btn">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div style="width: 32px; height: 32px; background: rgba(244, 63, 94, 0.2); color: #fb7185; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">YT</div>
                            <div>
                                <p style="font-size: 13px; font-weight: 600; color: #fff;">Tổ Y Tế</p>
                               
                            </div>
                        </div>
                        <span style="font-size: 12px; color: #34d399; font-weight: 500;">Vào bản đồ ➔</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const validLocations = { 'b104': 'Phòng B104', 'b109': 'Phòng B109', 'yte': 'Tổ Y Tế' };
        let html5QrCode = null;

        function goToMap(key) {
            try {
                if (html5QrCode) {
                    html5QrCode.stop().catch(err => {});
                }
            } catch(e) {}
            window.location.href = 'map.html?start=' + key;
        }

        function onScanSuccess(decodedText, decodedResult) {
            let text = decodedText.trim().toLowerCase();
            let targetKey = null;
            if (text.includes('b104')) targetKey = 'b104';
            else if (text.includes('b109')) targetKey = 'b109';
            else if (text.includes('yte') || text.includes('y tế')) targetKey = 'yte';

            if (targetKey) {
                goToMap(targetKey);
            }
        }

        function startScanner() {
            const placeholder = document.getElementById('camera-placeholder');
            if (placeholder) {
                placeholder.style.display = 'none';
            }
            
            try {
                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 15, qrbox: { width: 180, height: 180 } };
                
                html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    onScanSuccess
                ).catch(err => {
                    html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
                    .catch(error => {
                        alert("Không thể mở camera. Vui lòng cấp quyền.");
                        if (placeholder) placeholder.style.display = 'flex';
                    });
                });
            } catch(e) {
                alert("Lỗi khởi tạo camera.");
                if (placeholder) placeholder.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
